[project]
name = "silent-failure-detection"
version = "0.1.0"
description = "Label-free degradation monitoring for production ML across clinical, financial, and commercial models"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.35"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "import-linter>=2.0"]

[tool.setuptools]
packages = ["drift_core", "domains", "pipeline", "reports"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_packages = ["drift_core", "domains", "pipeline", "dashboard", "reports"]

[[tool.importlinter.contracts]]
name = "drift_core stays domain-agnostic"
type = "forbidden"
source_modules = ["drift_core"]
forbidden_modules = ["domains", "pipeline", "dashboard", "reports"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
