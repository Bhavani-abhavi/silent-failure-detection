[project]
name = "silent-failure-detection"
version = "0.1.0"
description = "Label-free degradation monitoring for a production credit model, validated against matured labels"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "pyarrow>=15.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "import-linter>=2.0"]

[tool.setuptools]
packages = [
    "drift_core",
    "domains",
    "pipeline",
    "model",
    "estimation",
    "backtest",
    "reports",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_packages = [
    "drift_core",
    "domains",
    "pipeline",
    "model",
    "estimation",
    "backtest",
    "reports",
]

[[tool.importlinter.contracts]]
name = "drift_core stays domain-agnostic"
type = "forbidden"
source_modules = ["drift_core"]
forbidden_modules = ["domains", "pipeline", "model", "estimation", "backtest", "reports"]

[[tool.importlinter.contracts]]
# The estimator must not be able to see the labels it is later scored against.
# Nothing enforces this at runtime, so it is enforced at the import graph:
# `estimation` reaching into a domain adapter would give it access to
# `default_label_within_horizon`, and the validation in component B would stop
# meaning anything.
name = "estimation cannot reach labels"
type = "forbidden"
source_modules = ["estimation"]
forbidden_modules = ["domains", "backtest", "reports"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
